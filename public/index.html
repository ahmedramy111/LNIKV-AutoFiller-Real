<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYNIKV AutoFiller</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="wrap"><section class="hero"><div class="brand">LYNIKV</div><h1>جلسة الحل مباشرة أمامك</h1><p>أدخل بيانات حساب الاختبار على منصتك ثم ابدأ الجلسة.</p></section><section class="card"><label>رقم الهاتف</label><input id="phone" inputmode="numeric" maxlength="11" placeholder="11 رقمًا"><label>كود الحساب</label><input id="code" inputmode="numeric" placeholder="الكود"><label>كلمة المرور</label><input id="pass" type="password" placeholder="كلمة المرور"><button id="start">بدء الجلسة</button><div id="msg"></div></section><section class="grid"><div class="stat"><b id="status">متوقف</b><span>حالة الحل</span></div><div class="stat"><b id="events">0</b><span>عناصر مكتملة</span></div><div class="stat"><b id="last">—</b><span>آخر فصل</span></div></section><section class="card"><h3>النشاط المباشر</h3><div id="activity">نشاط جلستك هيظهر هنا.</div></section><section class="card"><h3>الفصول</h3><div id="chapters">جلستك بس<br>لسه مفيش تقدم للحساب ده</div></section></main><script src="/assets/app.js"></script></body></html>
